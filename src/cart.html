<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ hàng - GIBOR COFFEE</title>
    <!-- Dùng logo có sẵn để tránh trình duyệt gọi favicon.ico bị 404 -->
    <link rel="icon" href="images/logo/logo.jpg" />

    <!-- THEME CHÍNH DÙNG CHUNG-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <!-- CSS RIÊNG CHO CART -->
    <link rel="stylesheet" href="css/cart.css" />
    <!-- MOBILE RESPONSIVE -->
    <link rel="stylesheet" href="css/mobile-runtime.css?v=3.1.0" />

    <!-- FONT DÙNG CHUNG -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&family=Mrs+Saint+Delafield&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <!-- HEADER DÙNG CHUNG -->
    <div id="header-placeholder"></div>

    <main class="cart-container cart-page container">
      <!-- Loading Screen -->
      <div class="logo" id="preloader">
        <div class="loader-icon">
          <img src="images/logo/logo.jpg" alt="GIBOR Coffee" />
        </div>
        <p
          style="
            color: white;
            margin-top: 20px;
            letter-spacing: 5px;
            font-weight: 600;
          "
        >
          GIBOR COFFEE
        </p>
      </div>

      <h2 class="cart-title text-center mb-4 mb-lg-5"> GIỎ HÀNG CỦA BẠN</h2>

      <!-- Giỏ hàng trống -->
      <div class="cart-empty card border-0" id="cartEmpty">
        <i class="fa-solid fa-cart-shopping"></i>
        <p>Giỏ hàng của bạn đang trống!</p>
        <a href="menu.html" class="btn-back-menu">Xem Menu</a>
      </div>

      <!-- Bảng giỏ hàng -->
      <div class="cart-content hidden" id="cartContent">
        <!-- Bootstrap grid: desktop 2 cột, mobile tự xếp 1 cột -->
        <div class="row g-4 align-items-start">
          <div class="col-lg-8">
            <section class="cart-list-card card border-0">
              <div class="card-body p-0">
                <div class="cart-table-responsive table-responsive">
                  <table class="cart-table table align-middle mb-0">
                    <thead>
                      <tr>
                        <th>Sản phẩm</th>
                        <th>Size</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                        <th>Xóa</th>
                      </tr>
                    </thead>
                    <tbody id="cartBody">
                      <!-- Các sản phẩm sẽ được render bởi JS -->
                    </tbody>
                  </table>
                </div>
              </div>
            </section>
          </div>

          <div class="col-lg-4">
            <!-- Summary giữ id cũ để cart.js cập nhật tổng tiền -->
            <aside class="cart-summary card border-0">
              <div class="card-body">
                <div class="cart-summary-info">
                  <p>Tổng sản phẩm: <strong id="totalItems">0</strong></p>
                  <p class="cart-total">
                    Tổng tiền: <strong id="totalPrice">0đ</strong>
                  </p>
                </div>
                <div class="cart-actions d-flex flex-column gap-2">
                  <button class="btn-clear btn" id="btnClearCart">
                    <i class="fa-solid fa-trash"></i> Xóa tất cả
                  </button>
                  <a href="menu.html" class="btn-continue btn">
                    <i class="fa-solid fa-arrow-left"></i> Tiếp tục mua
                  </a>
                  <button class="btn-checkout btn" id="btnCheckout">
                    <i class="fa-solid fa-credit-card"></i> Thanh toán
                  </button>
                </div>
              </div>
            </aside>
          </div>
        </div>
      </div>

      <!-- Popup xác nhận thanh toán -->
      <div class="checkout-overlay" id="checkoutOverlay">
        <div class="checkout-box">
          <span class="checkout-close" id="checkoutClose">✕</span>
          <h3>🧾 XÁC NHẬN ĐƠN HÀNG</h3>
          <div class="checkout-details" id="checkoutDetails">
            <!-- Chi tiết đơn hàng sẽ được render bởi JS -->
          </div>
          <div class="checkout-total">
            Tổng thanh toán: <strong id="checkoutTotal">0đ</strong>
          </div>
          <div class="checkout-actions">
            <button class="btn-cancel" id="btnCancelCheckout">Hủy</button>
            <button class="btn-confirm" id="btnConfirmCheckout">
              <i class="fa-solid fa-check"></i> Xác nhận đặt hàng
            </button>
          </div>
        </div>
      </div>

      <!-- Thông báo thành công -->
      <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMessage">Thao tác thành công!</span>
      </div>
    </main>

    <!-- FOOTER DÙNG CHUNG -->
    <div id="footer-placeholder"></div>

    <!-- Firebase SDK cho xác thực Google -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

    <!-- Khởi tạo Firebase -->
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCHlDt2bUN4YWJon-lj7941SQcmCT7m1_E",
        authDomain: "manage-coffee-3a860.firebaseapp.com",
        projectId: "manage-coffee-3a860",
        storageBucket: "manage-coffee-3a860.firebasestorage.app",
        messagingSenderId: "655567890516",
        appId: "1:655567890516:web:0fab5cfe362cd97db265c1",
        measurementId: "G-LB57G2S1N2"
      };
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
    </script>

    <!-- Phần JS CHUNG -->
    <script src="js/components.js"></script>
    <script src="js/data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <!-- JS RIÊNG CHO CART -->
    <script src="js/cart.js"></script>
    <script src="js/mobile.js?v=3.1.0"></script>
  </body>
</html>
